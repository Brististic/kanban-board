services:
  - type: web
    name: kanban-backend
    runtime: node
    plan: free
    rootDir: kanban-backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

  - type: web
    name: kanban-frontend
    runtime: static
    rootDir: kanban-board
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kanban-backend
          property: host
